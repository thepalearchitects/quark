version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      next:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      clerk:
        patterns:
          - "@clerk/*"
      monaco:
        patterns:
          - "@monaco-editor/*"
          - "monaco-editor"
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript"
          - "tailwindcss"
          - "postcss"
          - "@types/*"
    ignore:
      # don't bump major versions automatically — review those manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
